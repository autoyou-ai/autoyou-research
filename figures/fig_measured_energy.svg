  <g id="text_17">
   <text style="font-size: 8px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #7b8794" transform="translate(42.375488 307.296184)">Seven repetitions per model per run; bars are medians, whiskers are observed minima and maxima. Each model's</text>
   <text style="font-size: 8px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #7b8794" transform="translate(55.131113 316.003215)">independent replication is shown beside its primary run. Request window only; host draw and PSU loss are</text>
