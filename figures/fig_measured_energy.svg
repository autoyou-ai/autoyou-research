   <text style="font-size: 8px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #7b8794" transform="translate(164.292988 333.41759)">s, giving 4-5 distinct readings per 3B request.</text>
